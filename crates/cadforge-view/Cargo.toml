[package]
name = "cadforge-view"
version = "0.1.0-beta.1"
edition = "2021"
description = "Vector viewer for cadforge projects"
license = "MIT"
publish = true

[[bin]]
name = "cadforge-view"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arboard = "3.4"
bytemuck = { version = "1.16", features = ["derive"] }
cadforge = { path = "../.." }
pollster = "0.3"
wgpu = "0.20"
winit = "0.30"
