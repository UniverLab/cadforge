# cadspec demo — terminal (CAD as code) + the live SVG preview in a browser pane.
#
# Generate the GIF with DemoStage (https://github.com/UniverLab/demo-stage):
#   demo check demo/demo.toml
#   demo export demo/demo.toml --target gif      # → demo/dist/cadspec.gif
#
# NOTE: browser panes are captured *after* the terminal run, so the
# `cadspec serve` background server must still be up at capture time — this demo
# deliberately does NOT stop it. Afterwards: `cd /tmp/cadspec-demo/bracket &&
# cadspec serve --stop`. Adjust commands/url to your build if they drift.

[demo]
name = "cadspec"
output_dir = "demo/dist"

[typing]
base_ms = 70
salt_ms = 14
seed = 7

[env]
isolated = true
setup_script = "rm -rf /tmp/cadspec-demo && mkdir -p /tmp/cadspec-demo && cd /tmp/cadspec-demo"

[layout]
width = 1280
height = 720
fps = 12
background = "#0b0f14"

  [[layout.panes]]
  id = "console"
  type = "terminal"
  x = 0
  y = 0
  width = 760
  height = 720
  font_size = 15

  [[layout.panes]]
  id = "preview"
  type = "browser"
  x = 760
  y = 0
  width = 520
  height = 720
  url = "http://127.0.0.1:4377"

[[timeline]]
action = "focus"
pane = "console"

[[timeline]]
action = "caption"
text = "1 — scaffold a CAD project"

[[timeline]]
action = "type"
text = "cadspec new bracket && cd bracket"
human_salt = true

[[timeline]]
action = "keypress"
key = "enter"

[[timeline]]
action = "wait"
duration_ms = 1500

[[timeline]]
action = "caption"
text = "2 — start the live preview"

[[timeline]]
action = "type"
text = "cadspec serve"
human_salt = true

[[timeline]]
action = "keypress"
key = "enter"

[[timeline]]
action = "wait_for_stdout"
match = "127.0.0.1:4377"

[[timeline]]
action = "wait"
duration_ms = 1500

[[timeline]]
action = "caption"
text = "3 — the drawing renders in the browser"

[[timeline]]
action = "focus"
pane = "preview"

[[timeline]]
action = "scroll"
direction = "down"
duration_ms = 2500

[[timeline]]
action = "terminate"
