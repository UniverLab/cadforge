[package]
name = "cadforge-cli"
version = "0.1.0-beta.2"
edition = "2021"
description = "CLI binary for cadforge"
license = "MIT"
publish = true

[[bin]]
name = "cadforge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
cadforge = { path = "../.." }
cadforge-view = { path = "../cadforge-view" }
